[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-inventory-ledger"
version = "0.1.0"
description = "Multimodal pre-loss home inventory & coverage adequacy decision agent powered by Gemini 4 Carbon, Gemini 4 Hydrogen, Gemini Decision-1, and Shopify Shop MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["ingest*", "models*", "commerce*", "ledger*", "app*", "eval*"]

[tool.setuptools]
py-modules = ["contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
