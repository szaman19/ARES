[project]
name = "ares"
version = "0.1.0"
description = "ARES: Search framework for orchestrating parallel agent swarms, deterministic verification, and automatic context management."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "google-genai>=3.2.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
