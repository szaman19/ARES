[project]
name = "ares"
version = "0.2.0"
description = "ARES: Automated Reasoning State Machines for parallel agent execution, deterministic verification, and long/broken contexts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
llm = [
    "httpx>=0.27.0",
]
examples = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "duckdb>=1.1.0",
]

[project.scripts]
ares = "ares.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ares"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
